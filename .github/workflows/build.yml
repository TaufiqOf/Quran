name: Build Release

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x64 (AppImage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y wget fuse libfuse2 libvlc5 libvlccore9 vlc-plugin-base

      - name: Build Linux AppImage
        working-directory: Quran
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bash build_linux_x86.sh

      - name: Verify AppImage
        run: |
          if [ ! -f "Quran/dist/linux/Quran-x86_64.AppImage" ]; then
            echo "ERROR: AppImage was not created."
            exit 1
          fi
          ls -lh Quran/dist/linux/Quran-x86_64.AppImage

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v5
        with:
          name: Quran-linux-x64
          path: Quran/dist/linux/Quran-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    name: Windows x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y wget zip unzip

      - name: Build Windows ZIP
        working-directory: Quran
        run: bash build_windows_x86.sh

      - name: Verify ZIP
        run: |
          if [ ! -f "Quran/dist/windows/Quran-windows-x64.zip" ]; then
            echo "ERROR: Windows ZIP was not created."
            exit 1
          fi
          ls -lh Quran/dist/windows/Quran-windows-x64.zip

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v5
        with:
          name: Quran-windows-x64
          path: Quran/dist/windows/Quran-windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish application
        shell: pwsh
        run: |
          dotnet publish Quran/Quran.csproj `
            --configuration Release `
            --runtime osx-arm64 `
            --self-contained true `
            --output "artifacts/Quran-macos-arm64" `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Create macOS app bundle
        shell: pwsh
        run: |
          $source = "artifacts/Quran-macos-arm64"
          $bundle = Join-Path $source "Quran.app"
          $contents = Join-Path $bundle "Contents"
          $macOS = Join-Path $contents "MacOS"
          $vlcBundleRoot = Join-Path $macOS "libvlc/osx-arm64"

          New-Item -ItemType Directory -Path $macOS -Force | Out-Null

          Get-ChildItem -Path $source -Force |
            Where-Object { $_.Name -ne 'Quran.app' } |
            ForEach-Object {
              Copy-Item -Path $_.FullName -Destination $macOS -Recurse -Force
            }

          $executable = Join-Path $macOS "Quran"

          if (-not (Test-Path $executable)) {
            throw "Published executable was not found in the macOS app bundle."
          }

          & chmod +x $executable

          # Remove unnecessary Windows DLLs
          Get-ChildItem -Path $macOS -Filter "*.dll" -File |
            Where-Object { $_.Name -notmatch "onnxruntime" } |
            Remove-Item -Force

          if (-not (Get-Command brew -ErrorAction SilentlyContinue)) {
            throw "Homebrew is required to install the VLC runtime on macOS."
          }

          & brew install --cask vlc

          $vlcApp = Get-ChildItem `
            -Path "/Applications" `
            -Directory `
            -Filter "VLC.app" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $vlcApp) {
            throw "VLC.app was not found after installation."
          }

          $vlcMacOS = Join-Path $vlcApp.FullName "Contents/MacOS"
          $vlcLib = Join-Path $vlcMacOS "lib"
          $vlcPlugins = Join-Path $vlcMacOS "plugins"

          if (-not (Test-Path $vlcLib)) {
            throw "VLC lib directory was not found."
          }

          if (-not (Test-Path $vlcPlugins)) {
            throw "VLC plugins directory was not found."
          }

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $vlcBundleRoot "lib") `
            -Force |
            Out-Null

          Copy-Item `
            -Path $vlcLib `
            -Destination $vlcBundleRoot `
            -Recurse `
            -Force

          Copy-Item `
            -Path $vlcPlugins `
            -Destination $vlcBundleRoot `
            -Recurse `
            -Force

          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Quran</string>

              <key>CFBundleDisplayName</key>
              <string>Quran</string>

              <key>CFBundleExecutable</key>
              <string>Quran</string>

              <key>CFBundleIdentifier</key>
              <string>com.github.quran.desktop</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
          </dict>
          </plist>
          "@ | Set-Content `
            -Encoding utf8 `
            (Join-Path $contents "Info.plist")

      - name: Include macOS ONNX Runtime libraries
        shell: bash
        run: |
          if [ -n "$NUGET_PACKAGES" ]; then
            NUGET_ROOT="$NUGET_PACKAGES"
          else
            NUGET_ROOT="$HOME/.nuget/packages"
          fi

          ONNX_PACKAGE=$(find "$NUGET_ROOT/microsoft.ml.onnxruntime" \
            -maxdepth 1 -type d | sort -V | tail -1)

          if [ -z "$ONNX_PACKAGE" ] || [ ! -d "$ONNX_PACKAGE" ]; then
            echo "WARNING: ONNX Runtime package not found"
            exit 0
          fi

          SOURCE="$ONNX_PACKAGE/runtimes/osx-arm64/native"
          DESTINATION="artifacts/Quran-macos-arm64/Quran.app/Contents/MacOS"

          if [ ! -d "$SOURCE" ]; then
            echo "WARNING: macOS ARM64 ONNX Runtime directory not found"
            exit 0
          fi

          cp "$SOURCE"/onnxruntime.dylib "$DESTINATION/" 2>/dev/null || true
          cp "$SOURCE"/onnxruntime_providers_shared.dylib "$DESTINATION/" 2>/dev/null || true

      - name: Verify Storage
        shell: pwsh
        run: |
          $storage = "artifacts/Quran-macos-arm64/Storage"

          if (-not (Test-Path $storage)) {
            throw "Storage directory was not published."
          }

          if (-not (Get-ChildItem -Path $storage -File -Recurse)) {
            throw "Storage directory is empty."
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          ditto -c -k --keepParent `
            "artifacts/Quran-macos-arm64/Quran.app" `
            "artifacts/Quran-macos-arm64.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v5
        with:
          name: Quran-macos-arm64
          path: artifacts/Quran-macos-arm64.zip
          if-no-files-found: error

  upload-release:
    name: Upload files to Release
    needs: [build-linux, build-windows, build-macos]
    
    if: github.event_name == 'release'
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
  
      - name: Display downloaded files
        run: ls -lh artifacts/
  
      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Quran-x86_64.AppImage
            artifacts/Quran-windows-x64.zip
            artifacts/Quran-macos-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}