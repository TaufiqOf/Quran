name: Build Release

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            artifact: Quran-windows-x64

          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            artifact: Quran-linux-x64

          - name: macOS ARM64
            os: macos-latest
            rid: osx-arm64
            artifact: Quran-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish application
        shell: pwsh
        run: |
          dotnet publish Quran/Quran.csproj `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            --self-contained true `
            --output "artifacts/${{ matrix.artifact }}" `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Create macOS app bundle
        if: matrix.rid == 'osx-arm64'
        shell: pwsh
        run: |
          $source = "artifacts/${{ matrix.artifact }}"
          $bundle = Join-Path $source "Quran.app"
          $contents = Join-Path $bundle "Contents"
          $macOS = Join-Path $contents "MacOS"
          $vlcBundleRoot = Join-Path $macOS "libvlc/osx-arm64"

          New-Item -ItemType Directory -Path $macOS -Force | Out-Null

          Get-ChildItem -Path $source -Force |
            Where-Object { $_.Name -ne 'Quran.app' } |
            ForEach-Object {
              Copy-Item -Path $_.FullName -Destination $macOS -Recurse -Force
            }

          $executable = Join-Path $macOS "Quran"

          if (-not (Test-Path $executable)) {
            throw "Published executable was not found in the macOS app bundle."
          }

          & chmod +x $executable

          # Remove unnecessary Windows DLLs
          Get-ChildItem -Path $macOS -Filter "*.dll" -File |
            Where-Object { $_.Name -notmatch "onnxruntime" } |
            Remove-Item -Force

          if (-not (Get-Command brew -ErrorAction SilentlyContinue)) {
            throw "Homebrew is required to install the VLC runtime on macOS."
          }

          & brew install --cask vlc

          $vlcApp = Get-ChildItem `
            -Path "/Applications" `
            -Directory `
            -Filter "VLC.app" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $vlcApp) {
            throw "VLC.app was not found after installation."
          }

          $vlcMacOS = Join-Path $vlcApp.FullName "Contents/MacOS"
          $vlcLib = Join-Path $vlcMacOS "lib"
          $vlcPlugins = Join-Path $vlcMacOS "plugins"

          if (-not (Test-Path $vlcLib)) {
            throw "VLC lib directory was not found."
          }

          if (-not (Test-Path $vlcPlugins)) {
            throw "VLC plugins directory was not found."
          }

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $vlcBundleRoot "lib") `
            -Force |
            Out-Null

          Copy-Item `
            -Path $vlcLib `
            -Destination $vlcBundleRoot `
            -Recurse `
            -Force

          Copy-Item `
            -Path $vlcPlugins `
            -Destination $vlcBundleRoot `
            -Recurse `
            -Force

          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Quran</string>

              <key>CFBundleDisplayName</key>
              <string>Quran</string>

              <key>CFBundleExecutable</key>
              <string>Quran</string>

              <key>CFBundleIdentifier</key>
              <string>com.github.quran.desktop</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
          </dict>
          </plist>
          "@ | Set-Content `
            -Encoding utf8 `
            (Join-Path $contents "Info.plist")

      - name: Include Windows LibVLC native runtime
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $nugetPackages = if ($env:NUGET_PACKAGES) {
            $env:NUGET_PACKAGES
          }
          else {
            Join-Path $env:USERPROFILE ".nuget/packages"
          }

          $package = Get-ChildItem `
            -Path (Join-Path $nugetPackages "videolan.libvlc.windows") `
            -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if ($null -eq $package) {
            throw "VideoLAN.LibVLC.Windows was not restored."
          }

          $source = Join-Path $package.FullName "build/x64"
          $destination = "artifacts/${{ matrix.artifact }}/libvlc/win-x64"

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force |
            Out-Null

          Copy-Item `
            -Path (Join-Path $source "*") `
            -Destination $destination `
            -Recurse `
            -Force

          if (-not (Test-Path (Join-Path $destination "libvlc.dll"))) {
            throw "libvlc.dll was not copied."
          }

          if (-not (Test-Path (Join-Path $destination "libvlccore.dll"))) {
            throw "libvlccore.dll was not copied."
          }

      - name: Include Windows ONNX Runtime DLLs
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $nugetPackages = if ($env:NUGET_PACKAGES) {
            $env:NUGET_PACKAGES
          }
          else {
            Join-Path $env:USERPROFILE ".nuget/packages"
          }

          $package = Get-ChildItem `
            -Path (Join-Path $nugetPackages "microsoft.ml.onnxruntime") `
            -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if ($null -eq $package) {
            throw "Microsoft.ML.OnnxRuntime was not restored."
          }

          $source = Join-Path $package.FullName "runtimes/win-x64/native"
          $destination = "artifacts/${{ matrix.artifact }}"

          if (-not (Test-Path $source)) {
            throw "ONNX Runtime native directory not found at $source"
          }

          Copy-Item `
            (Join-Path $source "onnxruntime.dll") `
            -Destination $destination `
            -Force `
            -ErrorAction SilentlyContinue

          Copy-Item `
            (Join-Path $source "onnxruntime_providers_shared.dll") `
            -Destination $destination `
            -Force `
            -ErrorAction SilentlyContinue

      - name: Include Linux LibVLC native runtime
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc5 libvlccore9 vlc-plugin-base
          
          # Create destination directory
          mkdir -p "artifacts/${{ matrix.artifact }}/libvlc/linux-x64"
          
          # Copy libvlc libraries
          cp /usr/lib/x86_64-linux-gnu/libvlc.so* "artifacts/${{ matrix.artifact }}/libvlc/linux-x64/" 2>/dev/null || true
          cp /usr/lib/x86_64-linux-gnu/libvlccore.so* "artifacts/${{ matrix.artifact }}/libvlc/linux-x64/" 2>/dev/null || true
          
          # Copy VLC plugins directory
          if [ -d "/usr/lib/x86_64-linux-gnu/vlc/plugins" ]; then
            cp -r "/usr/lib/x86_64-linux-gnu/vlc/plugins" "artifacts/${{ matrix.artifact }}/libvlc/linux-x64/" 2>/dev/null || true
          fi
          
          echo "LibVLC libraries installed"

      - name: Include Linux ONNX Runtime DLLs
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          if [ -n "$NUGET_PACKAGES" ]; then
            NUGET_ROOT="$NUGET_PACKAGES"
          else
            NUGET_ROOT="$HOME/.nuget/packages"
          fi

          ONNX_PACKAGE=$(find "$NUGET_ROOT/microsoft.ml.onnxruntime" \
            -maxdepth 1 -type d | sort -V | tail -1)

          if [ -z "$ONNX_PACKAGE" ] || [ ! -d "$ONNX_PACKAGE" ]; then
            echo "WARNING: ONNX Runtime package not found"
            exit 0
          fi

          SOURCE="$ONNX_PACKAGE/runtimes/linux-x64/native"
          DESTINATION="artifacts/${{ matrix.artifact }}"

          if [ ! -d "$SOURCE" ]; then
            echo "WARNING: ONNX Runtime native directory not found"
            exit 0
          fi

          cp "$SOURCE"/onnxruntime.so "$DESTINATION/" 2>/dev/null || true
          cp "$SOURCE"/onnxruntime_providers_shared.so "$DESTINATION/" 2>/dev/null || true

      - name: Include macOS ONNX Runtime libraries
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          if [ -n "$NUGET_PACKAGES" ]; then
            NUGET_ROOT="$NUGET_PACKAGES"
          else
            NUGET_ROOT="$HOME/.nuget/packages"
          fi

          ONNX_PACKAGE=$(find "$NUGET_ROOT/microsoft.ml.onnxruntime" \
            -maxdepth 1 -type d | sort -V | tail -1)

          if [ -z "$ONNX_PACKAGE" ] || [ ! -d "$ONNX_PACKAGE" ]; then
            echo "WARNING: ONNX Runtime package not found"
            exit 0
          fi

          SOURCE="$ONNX_PACKAGE/runtimes/osx-arm64/native"
          DESTINATION="artifacts/${{ matrix.artifact }}/Quran.app/Contents/MacOS"

          if [ ! -d "$SOURCE" ]; then
            echo "WARNING: macOS ARM64 ONNX Runtime directory not found"
            exit 0
          fi

          cp "$SOURCE"/onnxruntime.dylib "$DESTINATION/" 2>/dev/null || true
          cp "$SOURCE"/onnxruntime_providers_shared.dylib "$DESTINATION/" 2>/dev/null || true


      - name: Verify Storage
        shell: pwsh
        run: |
          $storage = "artifacts/${{ matrix.artifact }}/Storage"

          if (-not (Test-Path $storage)) {
            throw "Storage directory was not published."
          }

          if (-not (Get-ChildItem -Path $storage -File -Recurse)) {
            throw "Storage directory is empty."
          }

      - name: Create ZIP for macOS
        if: matrix.rid == 'osx-arm64'
        shell: pwsh
        run: |
          ditto -c -k --keepParent `
            "artifacts/${{ matrix.artifact }}/Quran.app" `
            "artifacts/${{ matrix.artifact }}.zip"

      - name: Create ZIP for Windows and Linux
        if: matrix.rid != 'osx-arm64'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "artifacts/${{ matrix.artifact }}/*" `
            -DestinationPath "artifacts/${{ matrix.artifact }}.zip"

      - name: Upload temporary build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}.zip
          if-no-files-found: error

  upload-release:
    name: Upload files to Release
    needs: build

    if: github.event_name == 'release'

    runs-on: ubuntu-latest

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v5
        with:
          path: release-files
          merge-multiple: true

      - name: Show release files
        run: |
          ls -lah release-files

      - name: Upload ZIP files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-files/Quran-windows-x64.zip
            release-files/Quran-linux-x64.zip
            release-files/Quran-macos-arm64.zip