name: Build Release

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            artifact: Quran-windows-x64

          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            artifact: Quran-linux-x64

          - name: macOS x64
            os: macos-latest
            rid: osx-x64
            artifact: Quran-macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish application
        shell: pwsh
        run: |
          dotnet publish Quran/Quran.csproj `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            --self-contained true `
            --output "artifacts/${{ matrix.artifact }}" `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Create macOS app bundle
        if: matrix.rid == 'osx-x64'
        shell: pwsh
        run: |
          $source = "artifacts/${{ matrix.artifact }}"
          $bundle = Join-Path $source "Quran.app"
          $contents = Join-Path $bundle "Contents"
          $macOS = Join-Path $contents "MacOS"
          $vlcBundleRoot = Join-Path $macOS "libvlc/osx-x64"

          New-Item -ItemType Directory -Path $macOS -Force | Out-Null

          Get-ChildItem -Path $source -Force |
            Where-Object { $_.Name -ne 'Quran.app' } |
            ForEach-Object {
              Copy-Item -Path $_.FullName -Destination $macOS -Recurse -Force
            }

          $executable = Join-Path $macOS "Quran"
          if (-not (Test-Path $executable)) {
            throw "Published executable was not found in the macOS app bundle."
          }

          & chmod +x $executable

          if (-not (Get-Command brew -ErrorAction SilentlyContinue)) {
            throw "Homebrew is required to install the VLC runtime on macOS."
          }

          & brew install --cask vlc

          $vlcApp = Get-ChildItem -Path "/Applications" -Directory -Filter "VLC.app" -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $vlcApp) {
            throw "VLC.app was not found after installation."
          }

          $vlcMacOS = Join-Path $vlcApp.FullName "Contents/MacOS"
          $vlcLib = Join-Path $vlcMacOS "lib"
          $vlcPlugins = Join-Path $vlcMacOS "plugins"

          if (-not (Test-Path $vlcLib)) {
            throw "VLC lib directory was not found."
          }

          if (-not (Test-Path $vlcPlugins)) {
            throw "VLC plugins directory was not found."
          }

          New-Item -ItemType Directory -Path (Join-Path $vlcBundleRoot "lib") -Force | Out-Null
          Copy-Item -Path $vlcLib -Destination $vlcBundleRoot -Recurse -Force
          Copy-Item -Path $vlcPlugins -Destination $vlcBundleRoot -Recurse -Force

          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Quran</string>
            <key>CFBundleDisplayName</key>
            <string>Quran</string>
            <key>CFBundleExecutable</key>
            <string>Quran</string>
            <key>CFBundleIdentifier</key>
            <string>com.github.quran.desktop</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
          </dict>
          </plist>
          "@ | Set-Content -Encoding utf8 (Join-Path $contents "Info.plist")

      # LibVLCSharp loads these libraries by path at runtime. They must remain
      # external to the single-file executable.
      - name: Include Windows LibVLC native runtime
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $nugetPackages = if ($env:NUGET_PACKAGES) {
            $env:NUGET_PACKAGES
          } else {
            Join-Path $env:USERPROFILE ".nuget/packages"
          }
          $package = Get-ChildItem -Path (Join-Path $nugetPackages "videolan.libvlc.windows") -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if ($null -eq $package) { throw "VideoLAN.LibVLC.Windows was not restored." }

          $source = Join-Path $package.FullName "build/x64"
          $destination = "artifacts/${{ matrix.artifact }}/libvlc/win-x64"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -Path (Join-Path $source "*") -Destination $destination -Recurse -Force

          if (-not (Test-Path (Join-Path $destination "libvlc.dll"))) {
            throw "libvlc.dll was not copied to the release package."
          }
          if (-not (Test-Path (Join-Path $destination "libvlccore.dll"))) {
            throw "libvlccore.dll was not copied to the release package."
          }

      - name: Verify Storage
        shell: pwsh
        run: |
          $storage = "artifacts/${{ matrix.artifact }}/Storage"

          if (-not (Test-Path $storage)) {
            throw "Storage directory was not published."
          }

          if (-not (Get-ChildItem -Path $storage -File -Recurse)) {
            throw "Storage directory is empty."
          }

      - name: Create ZIP for macOS
        if: matrix.rid == 'osx-x64'
        shell: pwsh
        run: |
          ditto -c -k --keepParent `
            "artifacts/${{ matrix.artifact }}/Quran.app" `
            "artifacts/${{ matrix.artifact }}.zip"

      - name: Create ZIP for Windows and Linux
        if: matrix.rid != 'osx-x64'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "artifacts/${{ matrix.artifact }}/*" `
            -DestinationPath "artifacts/${{ matrix.artifact }}.zip"

      - name: Upload temporary build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}.zip
          if-no-files-found: error

  upload-release:
    name: Upload files to Release
    needs: build

    # Only upload to a release when triggered by a release.
    if: github.event_name == 'release'

    runs-on: ubuntu-latest

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v5
        with:
          path: release-files
          merge-multiple: true

      - name: Show release files
        run: |
          ls -lah release-files

      - name: Upload ZIP files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-files/Quran-windows-x64.zip
            release-files/Quran-linux-x64.zip
            release-files/Quran-macos-x64.zip
